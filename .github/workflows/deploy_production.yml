name: 'Deploy: Production'
on:
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log level (-v, -vv, -vvv)'
        required: true
        default: '-vv'

permissions:
  contents: read

jobs:
  deploy:
    uses: generoi/github-actions/.github/workflows/deploy.yml@v2
    secrets:
      # The shared workflow expects DEPLOY_SSH_PRIVATE_KEY; this repo's secret
      # predates that name.
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.KINSTA_DEPLOY_PRIVATE_KEY }}
      NPM_FONTAWESOME_AUTH_TOKEN: ${{ secrets.NPM_FONTAWESOME_AUTH_TOKEN }}
      COMPOSER_BOT_PRIVATE_KEY: ${{ secrets.COMPOSER_BOT_PRIVATE_KEY }}
    with:
      environment: 'production'
      log_level: ${{ inputs.log_level }}
  e2e:
    needs: deploy
    uses: ./.github/workflows/e2e.yml
    with:
      url: 'https://gdsbedrock.kinsta.cloud'
