# PRs disabled (open-pull-requests-limit: 0): dependency updates happen in the
# maintenance pass, Dependabot PRs were only noise and CI minutes.

version: 2
updates:
  - package-ecosystem: "npm"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "monthly"
    registries:
      - fontawesome
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  - package-ecosystem: "composer"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      composer:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 0
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "major"
          - "minor"
          - "patch"

registries:
  fontawesome:
    type: npm-registry
    url: //npm.fontawesome.com/
    token: ${{ secrets.NPM_FONTAWESOME_AUTH_TOKEN }}
